# frontend: nginx servira Tetris UI i proksira /api/ na backend u app segmentu.
server {
    listen 80;
    server_name frontend.projekt.lab;

    root /usr/share/nginx/html;
    index tetris.html;

    location / {
        try_files $uri /tetris.html;
    }

    # /api ide na backend preko DNS imena (AO-7), nikad na IP
    location /api/ {
        proxy_pass http://backend.projekt.lab:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /health {
        return 200 "ok\n";
    }
}
