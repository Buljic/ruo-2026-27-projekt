[defaults]
inventory = inventory.ini
vault_password_file = .vault_pass
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False
forks = 8

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o IdentitiesOnly=yes
pipelining = True
